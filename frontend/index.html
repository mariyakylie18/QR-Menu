<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR menu</title>
    <p id="table-number"></p>
    <link rel="stylesheet" href="style.css" />
  </head>
  <div id="cart-modal" class="cart-modal">
    <div class="cart-content">
      <button id="close-cart-btn" type="button">x</button>
      <h2>Your Cart</h2>
      <div id="cart-items"></div>

      <p>
        Total:
        <strong id="cart-total">0₮</strong>
      </p>
      <button id="place-order-btn" type="button">Place order</button>
    </div>
  </div>
  <p id="order-status"></p>
  <body>
    <main class="container">
      <button id="cart-btn" type="button">
        🛒 Захиалга (<span id="cart-count">0</span>)
      </button>
      <header class="menu-header">
        <p class="restaurant-label">Тавтай морилно уу</p>
        <!-- <h1>Та захиалгаа өгнө үү</h1> -->
        <p class="restaurant-description">Та захиалгаа сонгоно уу</p>
      </header>

      <section class="search-section">
        <input
          type="search"
          id="search-input"
          placeholder="Search food ..."
          aria-label="Search food "
        />

        <button id="search-btn" type="button">Search</button>
        <!-- <button class="close-modal">x</button> -->
      </section>
      <div class="menu-types">
        <button class="type-btn active" data-type="food">Хоол</button>
        <button class="type-btn" data-type="drink">Уух зүйл</button>
      </div>
      <nav
        id="category-list"
        class="categories"
        aria-label="Food categories"
      ></nav>
    </main>
    <div id="food-list"></div>
    <div class="pagination">
      <button id="prev-page-btn" type="button">Өмнөх</button>
      <span id="page-info">Page 1 / 1</span>
      <button id="next-page-btn" type="button">Дараагийн</button>
    </div>
    <script src="https://qr-menu-nd8d.onrender.com/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
  </body>
</html>
