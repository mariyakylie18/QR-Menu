<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      const MAINTENANCE_MODE = false;
      if (MAINTENANCE_MODE) {
        window.location.replace("maintenance.html");
      }
    </script>
    <title>QR menu</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <div id="cart-modal" class="cart-modal">
    <div class="cart-content">
      <button id="close-cart-btn" type="button">x</button>
      <h2>Захиалгаа харах</h2>
      <div id="cart-items"></div>

      <p>
        Нийт дүн:
        <strong id="cart-total">0₮</strong>
      </p>
      <button id="place-order-btn" type="button">Захиалга өгөх</button>
    </div>
  </div>
  <div id="customer-history-modal" class="customer-history-modal">
    <div class="customer-history-content">
      <button id="close-customer-history-btn" type="button">x</button>
      <h2>Захиалгын түүх</h2>
      <div id="customer-history-items"></div>
    </div>
  </div>
  <body>
    <main class="container">
      <header class="menu-header">
        <p id="order-status"></p>
        <p class="restaurant-label">Улиастай ресторан</p>
        <!-- <h1>Та захиалгаа өгнө үү</h1> -->
        <p class="restaurant-description">Та захиалгаа сонгоно уу</p>
      </header>

      <section class="search-section">
        <input
          type="search"
          id="search-input"
          placeholder="Нэрээр хайх..."
          aria-label="Search food "
        />

        <button id="search-btn" type="button">Search</button>
        <!-- <button class="close-modal">x</button> -->
      </section>
      <p id="table-number">Ширээ</p>
      <div class="menu-type-row">
        <div class="menu-types">
          <button class="type-btn active" data-type="food">Хоол</button>
          <button class="type-btn" data-type="drink">Уух зүйлс</button>
        </div>
        <p class="image-note">* Менюн дээрх зураг бодит зураг биш болно.</p>
      </div>
      <nav
        id="category-list"
        class="categories"
        aria-label="Food categories"
      ></nav>
      <div id="food-list"></div>

      <div class="bottom-actions">
        <button id="cart-btn" type="button">
          <span> 🛒 Миний захиалга</span>
          <span id="cart-count">0</span>
        </button>
        <button id="customer-history-btn" type="button">Захиалгын түүх</button>
      </div>

      <section class="customer-service">
        <button id="request-bill-btn" type="button">💳 Тооцоо авах</button>
      </section>
      <div class="pagination">
        <button id="prev-page-btn" type="button">Өмнөх</button>
        <span id="page-info">Хуудас 1 / 1</span>
        <button id="next-page-btn" type="button">Дараах</button>
      </div>
    </main>
    <script src="https://qr-menu-nd8d.onrender.com/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
  </body>
</html>
