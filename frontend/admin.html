<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Menu Admin</title>
    <link rel="stylesheet" href="admin.css" />
  </head>
  <div id="toast" class="toast"></div>
  <body>
    <header class="admin-header">
      <div>
        <h1>Admin Panel</h1>
        <p>Manage restaurant menu</p>
      </div>
      <button id="logout-btn">Logout</button>
    </header>

    <section class="stats">
      <div class="stat-card">
        <p>Total Foods</p>
        <h2 id="total-foods">0</h2>
      </div>
      <div class="stat-card">
        <p>Categories</p>
        <h2 id="total-categories">0</h2>
      </div>
    </section>

    <button id="open-add-food-btn" type="button">+ Add food</button>
    <section class="admin-section">
      <div id="food-modal" class="modal">
        <div class="modal-content">
          <button id="close-modal-btn" type="button"></button>
          <h2 id="form-title">Add Food</h2>
          <form id="add-food-form">
            <div id="form-group">
              <label for="food-name">Food name</label>
              <input
                id="food-name"
                type="text"
                placeholder="e.g chicken burger"
                required
              />
            </div>
            <div id="form-group">
              <label for="food-price">Price</label>
              <input
                id="food-price"
                type="number"
                placeholder="e.g 15000"
                min="0"
                step="100"
                required
              />
            </div>
            <div id="form-group">
              <label for="food-category">Category</label>
              <select id="food-category" required>
                <option value="">Select Categories</option>
                <option value="Food">Food</option>
                <option value="Drink">Drink</option>
                <option value="Burger">Burger</option>
                <option value="Pizza">Pizza</option>
                <option value="Dessert">Dessert</option>
              </select>
            </div>
            <div id="form-group">
              <label for="food-description">Description</label>
              <input
                id="food-description"
                type="text"
                placeholder="e.g Description"
                required
              />
            </div>
            <input id="food-image" type="file" accept="image/*" hidden />
            <button type="button" id="image-btn">Choose image</button>
            <span id="image-text">No image selected</span>
            <img id="current-image-preview" width="120" />
            <p id="image-note"></p>
            <button id="submit-food-btn" type="submit">Add Food</button>
          </form>
        </div>
      </div>
      <h2>Food</h2>
      <div class="food-tools">
        <input type="search" id="food-search" placeholder="Search foods..." />
        <button id="search-btn" type="submit">Search</button>
        <button type="button" id="clear-filter-btn">Clear</button>
        <select id="category-filter">
          <option value="">All categories</option>
        </select>
        <select id="sort-filter">
          <option value="">All prices</option>
          <option value="oldest">Oldest</option>
          <option value="newest">Newest</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
        </select>
      </div>
      <div id="food-list"></div>
      <div id="pagination" class="pagination">
        <button type="button" id="prev-page-btn">Previous</button>
        <span id="page-info">Page 1 / 1</span>
        <button type="button" id="next-page-btn">Next</button>
      </div>
      <div id="delete-modal" class="modal">
        <div class="modal-content delete-modal-content">
          <h2>Delete Food?</h2>
          <p>
            Are you sure you want to delete this food? This action cannot be
            undone.
          </p>
          <div class="delete-actions">
            <button type="button" id="cancel-delete-btn">Cancel</button>
            <button type="button" id="confirm-delete-btn">Delete</button>
          </div>
        </div>
      </div>
    </section>
    <script src="admin.js"></script>
  </body>
</html>
