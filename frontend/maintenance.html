<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR MENU</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 24px;

        background: radial-gradient(
          circle at top,
          #18271f 0%,
          #0d1512 45%,
          #070b09 100%
        );

        color: #f5f1e8;
        font-family: Arial, sans-serif;
      }

      .maintenance-card {
        width: 100%;
        max-width: 420px;

        padding: 48px 28px;

        text-align: center;

        background: rgba(16, 24, 20, 0.96);

        border: 1px solid #c9a84c;
        border-radius: 22px;

        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      }

      .logo {
        margin-bottom: 24px;

        color: #e7c45d;

        font-family: Georgia, serif;
        font-size: 34px;
        font-weight: 700;
      }

      h1 {
        margin: 0 0 16px;

        color: #e7c45d;
        font-size: 24px;
      }

      p {
        margin: 0;

        color: #ded8cb;
        font-size: 15px;
        line-height: 1.7;
      }

      .loader {
        width: 38px;
        height: 38px;

        margin: 28px auto;

        border: 3px solid rgba(201, 168, 76, 0.2);
        border-top-color: #e7c45d;
        border-radius: 50%;

        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div class="maintenance-card">
      <div class="logo">QR MENU</div>

      <h1>Систем шинэчлэгдэж байна</h1>

      <div class="loader"></div>

      <p>
        Манай цахим менюд түр шинэчлэлт хийж байна.<br />
        Тун удахгүй дахин ашиглах боломжтой болно.
      </p>
    </div>
  </body>
</html>
